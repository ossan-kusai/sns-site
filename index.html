<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自分の謎ルール診断</title>
    <meta
      name="description"
      content="自分の謎ルールとエゴイスト度を診断する、高級感のある白ベースの一枚物サイト。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f5f2ee;
        --paper-strong: #efeae5;
        --panel: rgba(255,255,255,0.8);
        --panel-strong: #fffdfb;
        --ink: #1d1b1a;
        --muted: #6c6863;
        --line: rgba(34,31,29,0.12);
        --shadow: 0 20px 40px rgba(28, 25, 23, 0.08);
        --shadow-soft: 0 12px 24px rgba(28,25,23,0.05);
        --gold: #b7a18a;
        --stone: #d6c8b9;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.96), rgba(245,239,234,0.94) 26%, rgba(240,235,230,0.98) 100%);
        font-family: "Zen Kaku Gothic New", sans-serif;
      }

      button,
      input,
      label,
      textarea {
        font: inherit;
      }

      button,
      .option,
      .scale-option,
      .check-option {
        touch-action: manipulation;
      }

      .page {
        width: min(1180px, calc(100% - 36px));
        margin: 0 auto;
        padding: 28px 0 90px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0 18px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255,255,255,0.5);
        box-shadow: var(--shadow-soft);
      }

      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(29,27,26,0.32);
        display: inline-block;
        position: relative;
      }

      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: rgba(29,27,26,0.18);
      }

      .brand-name {
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .hero {
        padding: 34px 36px 26px;
        background: rgba(255,255,255,0.66);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow: var(--shadow);
      }

      .hero-inner {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
        align-items: end;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3.4rem, 5vw, 5.4rem);
        line-height: 0.92;
        letter-spacing: -0.06em;
        font-weight: 600;
      }

      .lead {
        margin: 20px 0 0;
        max-width: 650px;
        font-size: 1.06rem;
        line-height: 1.85;
        color: var(--muted);
      }

      .meta-panel {
        padding: 18px 18px 14px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(245,240,236,0.8));
        border: 1px solid var(--line);
        box-shadow: var(--shadow-soft);
      }

      .meta-panel-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 12px;
      }

      .meta-item {
        padding: 14px 10px 12px;
        border-radius: 16px;
        background: rgba(255,255,255,0.5);
        border: 1px solid var(--line);
        text-align: center;
      }

      .meta-item strong {
        display: block;
        font-size: 1.25rem;
        letter-spacing: -0.04em;
      }

      .meta-item span {
        display: block;
        margin-top: 4px;
        font-size: 0.74rem;
        color: var(--muted);
      }

      .quiz-wrap {
        margin-top: 28px;
      }

      .quiz-card,
      .result-card {
        border-radius: 30px;
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .quiz-card {
        padding: 26px 22px 18px;
      }

      .question-block {
        padding: 22px 18px 18px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(245,240,236,0.52));
      }

      .question-block + .question-block {
        margin-top: 16px;
      }

      .question {
        margin: 0 0 18px;
        font-size: clamp(1.08rem, 1.9vw, 1.52rem);
        line-height: 1.7;
        letter-spacing: -0.03em;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 16px;
        min-height: 56px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.7);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        cursor: pointer;
      }

      .option:hover {
        transform: translateY(-1px);
        border-color: rgba(25,22,20,0.2);
        box-shadow: var(--shadow-soft);
      }

      .option input {
        appearance: none;
        width: 20px;
        height: 20px;
        margin: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(29,27,26,0.46);
        background: #fff;
        position: relative;
        flex-shrink: 0;
      }

      .option input:checked {
        border-color: var(--ink);
        background: var(--ink);
        box-shadow: inset 0 0 0 4px #fff;
      }

      .option label {
        width: 100%;
        cursor: pointer;
        color: var(--ink);
        line-height: 1.7;
      }

      .submit-wrap {
        padding: 24px 0 8px;
        display: flex;
        justify-content: center;
      }

      .primary-btn,
      .secondary-btn {
        appearance: none;
        cursor: pointer;
        border-radius: 999px;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        user-select: none;
      }

      .primary-btn {
        border: none;
        background: linear-gradient(180deg, #1d1b1a, #353230);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 17px 30px;
        min-width: 220px;
        min-height: 56px;
        box-shadow: 0 18px 28px rgba(29, 27, 26, 0.12);
      }

      .primary-btn:hover,
      .secondary-btn:hover {
        transform: translateY(-1px);
      }

      .primary-btn:active,
      .secondary-btn:active {
        transform: translateY(0);
      }

      .primary-btn:hover {
        box-shadow: 0 20px 32px rgba(29, 27, 26, 0.16);
      }

      .secondary-btn {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.78);
        color: var(--ink);
        padding: 12px 20px;
        min-height: 48px;
        font-weight: 700;
      }

      .result-card {
        display: none;
        margin-top: 28px;
        padding: 28px 24px 20px;
      }

      .result-card.visible {
        display: block;
      }

      .result-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .result-title {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.2rem, 4vw, 3.4rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .result-score {
        margin-top: 24px;
        padding: 22px 16px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(248,245,242,0.9), rgba(255,255,255,0.76));
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .score-ring {
        width: 152px;
        height: 152px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(#1d1b1a 0deg, #1d1b1a 216deg, #ebe2d8 216deg 360deg);
        box-shadow: inset 0 0 0 1px rgba(29,27,26,0.04);
      }

      .score-ring > div {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--line);
        font-weight: 900;
        font-size: 2.3rem;
        letter-spacing: -0.06em;
      }

      .score-ring small {
        font-size: 1rem;
        color: var(--muted);
        margin-left: 2px;
      }

      .score-meta {
        flex: 1;
      }

      .score-label {
        margin: 0 0 12px;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .meter {
        height: 12px;
        width: min(100%, 420px);
        border-radius: 999px;
        overflow: hidden;
        background: rgba(29,27,26,0.07);
        border: 1px solid var(--line);
      }

      .meter-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #1d1b1a, #8d837c);
        transition: width 0.3s ease;
      }

      .score-text {
        margin: 14px 0 0;
        line-height: 1.8;
        color: var(--ink);
      }

      .result-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 16px;
      }

      .result-grid article {
        padding: 18px 18px 20px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(245,242,239,0.7);
      }

      .result-grid span {
        display: block;
        margin-bottom: 12px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .result-grid strong {
        display: block;
        line-height: 1.8;
        letter-spacing: -0.02em;
      }

      .reset-wrap {
        margin-top: 22px;
        display: flex;
        justify-content: center;
      }

      @media (max-width: 820px) {
        .hero-inner,
        .result-grid,
        .result-score {
          grid-template-columns: 1fr;
          display: grid;
        }

        .result-score {
          justify-items: center;
          text-align: center;
        }

        .score-meta {
          width: 100%;
        }

        .meter {
          width: 100%;
        }
      }

      @media (max-width: 540px) {
        .page {
          width: min(100% - 18px, 1180px);
        }

        .hero {
          padding-left: 18px;
          padding-right: 18px;
        }

        .meta-panel-grid {
          grid-template-columns: repeat(3, minmax(0,1fr));
        }

        .primary-btn {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand" aria-label="診断サイトのブランド">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Mysterious Mode</span>
        </div>
      </header>

      <main>
        <section class="hero">
          <div class="hero-inner">
            <div>
              <p class="eyebrow">自分のクセを可視化する</p>
              <h1>自分の謎ルールは？</h1>
              <p class="lead">
                今日は、いちばんくだらないけど、いちばん正直な質問に答えてください。<br />
                あなたの“勝手に決めてるルール”と“エゴイスト度”を、あえて丁寧に診断します。
              </p>
            </div>

            <aside class="meta-panel" aria-label="診断の概要">
              <div class="meta-panel-grid">
                <div class="meta-item">
                  <strong>12</strong>
                  <span>質問</span>
                </div>
                <div class="meta-item">
                  <strong>6</strong>
                  <span>タイプ</span>
                </div>
                <div class="meta-item">
                  <strong>∞</strong>
                  <span>謎</span>
                </div>
              </div>
            </aside>
          </div>
        </section>

        <section class="quiz-wrap">
          <form id="quizForm" class="quiz-card">
            <div id="questions"></div>
            <div class="submit-wrap">
              <button type="submit" class="primary-btn">診断を確定する</button>
            </div>
          </form>

          <section id="result" class="result-card" aria-live="polite">
            <div class="result-head">
              <p class="eyebrow">診断結果</p>
              <h2 id="resultTitle" class="result-title">あなたのタイプ</h2>
            </div>

            <div class="result-score">
              <div class="score-ring" aria-hidden="true">
                <div><span id="egoScore">0</span><small>%</small></div>
              </div>

              <div class="score-meta">
                <p class="score-label">エゴイスト度</p>
                <div class="meter" aria-hidden="true">
                  <span id="meterFill" class="meter-fill"></span>
                </div>
                <p id="egoText" class="score-text">診断中…</p>
              </div>
            </div>

            <div class="result-grid">
              <article>
                <span>謎ルール</span>
                <strong id="ruleText">-</strong>
              </article>
              <article>
                <span>あなたの評価</span>
                <strong id="summaryText">-</strong>
              </article>
              <article>
                <span>次の一手</span>
                <strong id="adviceText">-</strong>
              </article>
            </div>

            <div class="reset-wrap">
              <button type="button" id="resetBtn" class="secondary-btn">もう一度診断する</button>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script>
      const questions = [
        {
          prompt: "大事な予定が急にキャンセルされたとき、最初に思うのは？",
          options: [
            { label: "『まじで？』と、少しだけ怒りを抱える", score: { ego: 3, rule: 2, calm: 1 } },
            { label: "『まあ、別の予定があるかも』と切り替える", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "『じゃあ自分の予定をどうするか』をちゃんと考える", score: { ego: 2, rule: 2, calm: 2 } },
            { label: "『こんなこと、最初からわかっていた気がする』と内心思う", score: { ego: 3, rule: 3, calm: 1 } }
          ]
        },
        {
          prompt: "会議で自分の案が通らなかった時、真っ先に出る感情は？",
          options: [
            { label: "『私のほうが正しかったのに』と一瞬だけ反省しない", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『次は言い方を変えよう』と改善策を考える", score: { ego: 1, rule: 2, calm: 3 } },
            { label: "『ああ、また人間関係が一段上がった』と解釈する", score: { ego: 2, rule: 3, calm: 2 } },
            { label: "『まあ、でも自分の感性は間違っていない』と自分を守る", score: { ego: 3, rule: 2, calm: 1 } }
          ]
        },
        {
          prompt: "友達があなたの予定を勝手に決めたとき、まず思うのは？",
          options: [
            { label: "『ちょっと待って、なんでそこまで決めてるの』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『むしろ助かる…でもちょっとめんどくさい』", score: { ego: 2, rule: 1, calm: 2 } },
            { label: "『これは自分の気分次第』と、静かに受け止める", score: { ego: 1, rule: 2, calm: 3 } },
            { label: "『次からはちゃんと許可を取る』と整える", score: { ego: 2, rule: 3, calm: 2 } }
          ]
        },
        {
          prompt: "SNSで誰かが自分の投稿に、ちょっと冷たい反応をしたとき、あなたは？",
          options: [
            { label: "『うーん、これわざとだろ』と把握してしまう", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『内容が弱かっただけかも』と分析する", score: { ego: 1, rule: 2, calm: 3 } },
            { label: "『たぶん自分の時差か、気にしない』と切り捨てる", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "『次はこう言えばよかった』と、翌日まで考える", score: { ego: 2, rule: 3, calm: 2 } }
          ]
        },
        {
          prompt: "誰かにお願いをされた時、断れない自分が一番イヤなのは？",
          options: [
            { label: "『断れない自分を嫌う』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『気持ちよく断れない自分が嫌だ』", score: { ego: 2, rule: 2, calm: 2 } },
            { label: "『理由が曖昧で、後から自分が嫌になる』", score: { ego: 2, rule: 3, calm: 1 } },
            { label: "『人に合わせるのがたまに楽しい』", score: { ego: 1, rule: 1, calm: 3 } }
          ]
        },
        {
          prompt: "人に“いいね”って言われたあと、あなたの中で一番先に来るのは？",
          options: [
            { label: "『やっぱり自分はすごい』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『次はもっとちゃんとやろう』", score: { ego: 1, rule: 2, calm: 3 } },
            { label: "『ほんとに？　たまたまかも』と謙遜する", score: { ego: 2, rule: 1, calm: 2 } },
            { label: "『ありがたい。だけどここからが本番』", score: { ego: 2, rule: 2, calm: 2 } }
          ]
        },
        {
          prompt: "自分の中で一番大事にしているものは？",
          options: [
            { label: "自分の感情の正しさ", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "人を不快にさせないこと", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "自分のペースと節度", score: { ego: 2, rule: 3, calm: 2 } },
            { label: "感情よりも、外から見える振る舞い", score: { ego: 2, rule: 2, calm: 2 } }
          ]
        },
        {
          prompt: "人と別れたあと、あなたの中で一番長く残るのは？",
          options: [
            { label: "『あの時、私がちゃんと伝えていれば』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『自分がどこで間違えたか』", score: { ego: 1, rule: 2, calm: 3 } },
            { label: "『どうしてこうなったのか』と理解を探す", score: { ego: 2, rule: 2, calm: 2 } },
            { label: "『あれ、私の立場はどこだったんだっけ』", score: { ego: 3, rule: 2, calm: 1 } }
          ]
        },
        {
          prompt: "食事の席で、自分の好みと相手の好みがズレた時、あなたは？",
          options: [
            { label: "『たぶん気にしてないけど、気になる』", score: { ego: 2, rule: 3, calm: 1 } },
            { label: "『相手が満足してたらOK』", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "『自分が好きなものを選ぶ』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『無理に合わせるより、ちゃんと伝える』", score: { ego: 2, rule: 2, calm: 2 } }
          ]
        },
        {
          prompt: "めちゃくちゃ疲れているとき、あなたの最終行動は？",
          options: [
            { label: "『もういい、今日は私が最優先』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『ここで休んでも大丈夫』と休む", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "『少しだけ我慢して、最後までやる』", score: { ego: 2, rule: 2, calm: 2 } },
            { label: "『相手に迷惑かけない程度にこなす』", score: { ego: 2, rule: 2, calm: 2 } }
          ]
        },
        {
          prompt: "「ちょっと待って」のあとに何も言わない人を見たら、あなたは？",
          options: [
            { label: "『何を考えてるんだろう』と余計に気になる", score: { ego: 2, rule: 2, calm: 1 } },
            { label: "『不安だな』と一人で解釈してしまう", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『そういう時もあるよね』と受け止める", score: { ego: 1, rule: 1, calm: 3 } },
            { label: "『話してくれたほうが安心できる』と少し言う", score: { ego: 2, rule: 3, calm: 2 } }
          ]
        },
        {
          prompt: "もし今の自分を一言で表すなら？",
          options: [
            { label: "『よく見せようとしてるが、内側はかなり頑固』", score: { ego: 3, rule: 3, calm: 1 } },
            { label: "『ちゃんとやってるつもりだけど、よく考えすぎる』", score: { ego: 2, rule: 2, calm: 2 } },
            { label: "『優しいけど、たまに自分を見失う』", score: { ego: 2, rule: 1, calm: 2 } },
            { label: "『人に合わせてるけど、実はルールを持ってる』", score: { ego: 2, rule: 3, calm: 2 } }
          ]
        }
      ];

      const form = document.getElementById('quizForm');
      const questionsContainer = document.getElementById('questions');
      const result = document.getElementById('result');
      const resultTitle = document.getElementById('resultTitle');
      const egoScore = document.getElementById('egoScore');
      const meterFill = document.getElementById('meterFill');
      const egoText = document.getElementById('egoText');
      const ruleText = document.getElementById('ruleText');
      const summaryText = document.getElementById('summaryText');
      const adviceText = document.getElementById('adviceText');
      const resetBtn = document.getElementById('resetBtn');

      function renderQuestions() {
        questionsContainer.innerHTML = questions.map((question, qi) => `
          <div class="question-block">
            <p class="question">Q${qi + 1}. ${question.prompt}</p>
            <div class="options">
              ${question.options.map((option, oi) => `
                <div class="option">
                  <input type="radio" name="q${qi}" id="q${qi}-${oi}" value="${oi}" required />
                  <label for="q${qi}-${oi}">${option.label}</label>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      }

      function scoreAnswers(formData) {
        return questions.reduce((acc, question, qi) => {
          const selected = Number(formData.get(`q${qi}`));
          if (Number.isInteger(selected) && question.options[selected]) {
            const option = question.options[selected];
            acc.ego += option.score.ego;
            acc.rule += option.score.rule;
            acc.calm += option.score.calm;
          }
          return acc;
        }, { ego: 0, rule: 0, calm: 0 });
      }

      function getDiagnosis(score) {
        const total = 12 * 3;
        const egoPercent = Math.min(100, Math.round((score.ego / total) * 100));
        const rulePercent = Math.min(100, Math.round((score.rule / total) * 100));
        const calmPercent = Math.min(100, Math.round((score.calm / total) * 100));

        const isHighEgo = egoPercent >= 68;
        const isHighRule = rulePercent >= 60;
        const isHighCalm = calmPercent >= 52;

        let title = '「よく見えないが、結構自分軸がある」タイプ';
        let rule = '自分の気持ちをちゃんと持っているが、言葉にすると少し不機嫌になる';
        let summary = 'あなたは表面では淡白でも、内側ではかなり“自分のルール”を持っているタイプです。';
        let advice = '自分の気持ちを一言で伝える練習をすると、周囲とのズレが少し減ります。';

        if (isHighEgo && isHighRule) {
          title = '「勝手にルールを作ってしまう」タイプ';
          rule = '自分の感情を優先したいけれど、そこに“ちゃんとした理由”を後から作ってしまう';
          summary = 'あなたは、外から見れば落ち着いていても、内側ではかなり正論を持っているタイプです。';
          advice = '自分の意見を黙って“きれいに処理”しすぎると、後で疲れやすいので、一度だけ率直に言ってみてください。';
        } else if (isHighEgo) {
          title = '「自己中心的に見えないけど、結構本音は強い」タイプ';
          rule = '自分を守る感覚が強いが、口に出す前に少しだけ理屈をはめる';
          summary = '自分の気持ちを隠すのが上手な分、相手に伝わらないときに“もっと言えばよかった”と感じやすいです。';
          advice = '人に気遣いすぎたあとに急に疲れるなら、少しだけ自分の気持ちを優先していいです。';
        } else if (isHighCalm) {
          title = '「たしかに良い人だが、内側ではじわじわわがまま」タイプ';
          rule = '周りに合わせられるが、自分が黙っているときほど“勝手なルール”が育つ';
          summary = 'あなたはとても配慮ができるので、周囲に優しい印象を持たれやすいです。';
          advice = '我慢を“優しさ”と勘違いしないように、たまにはちゃんと自分の気分を言葉にしてみてください。';
        } else if (isHighRule) {
          title = '「心の中に、かなり厳しいルールがある」タイプ';
          rule = '自分に厳しくなりすぎるか、相手に少しだけ理屈を押しつけてしまう';
          summary = 'あなたは、感情の整理が非常に早く、理屈で自分を支えているタイプです。';
          advice = '一度だけ“感情をそのまま言う”のを許してみると、表情が少し楽になります。';
        }

        if (egoPercent >= 75) {
          egoText.textContent = 'かなり自分ルールが強いです。自分にとっての“正義”が、思いの外大きい状態です。';
        } else if (egoPercent >= 50) {
          egoText.textContent = '中くらい。自分を守る感覚はありますが、まだ調整の余地は十分にあります。';
        } else {
          egoText.textContent = '低めです。むしろ自分の気持ちを後ろに置きやすいタイプですが、たまに限界が来ます。';
        }

        return { egoPercent, title, rule, summary, advice };
      }

      function updateResult(analysis) {
        const percent = analysis.egoPercent;
        egoScore.textContent = percent;
        meterFill.style.width = `${percent}%`;
        document.querySelector('.score-ring').style.background = `conic-gradient(#1d1b1a 0deg, #1d1b1a ${percent * 3.6}deg, #ebe2d8 ${percent * 3.6}deg 360deg)`;
        resultTitle.textContent = analysis.title;
        ruleText.textContent = analysis.rule;
        summaryText.textContent = analysis.summary;
        adviceText.textContent = analysis.advice;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const score = scoreAnswers(formData);
        const analysis = getDiagnosis(score);
        updateResult(analysis);
        result.classList.add('visible');
        result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      resetBtn.addEventListener('click', () => {
        form.reset();
        result.classList.remove('visible');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      renderQuestions();
    </script>
  </body>
</html>
